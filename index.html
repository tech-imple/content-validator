<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Content Quality Check</title>
<style>
body { font-family: Arial; background:#f5f7fb; padding:40px; }
.card { background:#fff; padding:30px; border-radius:12px; max-width:1100px; margin:auto; }
input { width:100%; padding:10px; margin-top:6px; }
button { padding:12px 22px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer; }
table { width:100%; margin-top:30px; border-collapse:collapse; }
th, td { border:1px solid #ddd; padding:12px; }
th { background:#eafff1; }
.badge { padding:6px 12px; border-radius:20px; font-weight:bold; }
.pending { background:#fde68a; }
.success { background:#bbf7d0; }
.error { background:#fecaca; }
</style>
</head>

<body>
<div class="card">
  <h1>Content Quality Check</h1>
  <p>Layered GPT-based validation</p>

  <label>Old Google Doc URL</label>
  <input id="oldDoc">

  <label>New Google Doc URL</label>
  <input id="newDoc">

  <br><br>
  <button onclick="runQC()">Run QC</button>

  <table>
    <thead>
      <tr>
        <th>Old Doc</th>
        <th>New Doc</th>
        <th>Layer-1</th>
        <th>Layer-2</th>
        <th>Final QC</th>
      </tr>
    </thead>
    <tbody id="result"></tbody>
  </table>
</div>

<script>
const API =
"https://script.google.com/macros/s/AKfycbwg7hhvgc_Iv2w4Fmz7UMW4nfc0JkbbaRDy93X6eFSqkYOWTDqHk8u9gX0f-pqwUso/exec";

let currentQC = "";

function runQC() {
  const oldDoc = document.getElementById("oldDoc").value.trim();
  const newDoc = document.getElementById("newDoc").value.trim();

  if (!oldDoc || !newDoc) {
    alert("Both URLs required");
    return;
  }

  fetch(API, {
    method: "POST",
    body: JSON.stringify({ oldDoc, newDoc })
  })
  .then(r => r.json())
  .then(res => {
    if (!res.success) throw res.error;
    currentQC = res.qcId;

    document.getElementById("result").innerHTML = `
      <tr>
        <td><a href="${oldDoc}" target="_blank">Open</a></td>
        <td><a href="${newDoc}" target="_blank">Open</a></td>
        <td class="badge pending">Queued</td>
        <td class="badge pending">Queued</td>
        <td class="badge pending">Waiting</td>
      </tr>`;

    pollStatus();
  })
  .catch(e => alert(e));
}

function pollStatus() {
  fetch(API)
    .then(r => r.json())
    .then(rows => {
      const row = rows.find(r => r["QC ID"] === currentQC);
      if (!row) return;

      updateUI(row);

      if (row["Final QC"] === "Pending") {
        setTimeout(pollStatus, 5000);
      }
    });
}

function updateUI(r) {
  document.getElementById("result").innerHTML = `
    <tr>
      <td><a href="${r["Old Doc URL"]}" target="_blank">Open</a></td>
      <td><a href="${r["New Doc URL"]}" target="_blank">Open</a></td>
      <td>${r["Layer-1 Output"]}</td>
      <td>${r["Layer-2 Output"]}</td>
      <td class="badge ${r["Final QC"]==="Pending"?"pending":"success"}">${r["Final QC"]}</td>
    </tr>`;
}
</script>
</body>
</html>
