<!DOCTYPE html>
<html>
<head>
  <title>Content QC Validator</title>
  <style>
    body { font-family: Arial; padding: 40px; }
    input { width: 90%; padding: 10px; margin: 10px 0; }
    button { padding: 12px 20px; font-size: 16px; cursor: pointer; }
    #status { margin-top: 15px; }
  </style>
</head>
<body>

<h2>Content Quality Check</h2>

<input id="oldDoc" placeholder="Old Google Doc URL">
<input id="newDoc" placeholder="New Google Doc URL">

<button onclick="runQC()">Run QC</button>

<p id="status"></p>

<script>
function runQC() {
  const oldDoc = document.getElementById("oldDoc").value.trim();
  const newDoc = document.getElementById("newDoc").value.trim();

  if (!oldDoc || !newDoc) {
    alert("Both URLs are required");
    return;
  }

  document.getElementById("status").innerText = "Submitting...";

  fetch("https://script.google.com/macros/s/AKfycbwg7hhvgc_Iv2w4Fmz7UMW4nfc0JkbbaRDy93X6eFSqkYOWTDqHk8u9gX0f-pqwUso/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ oldDoc, newDoc })
  })
  .then(() => {
    document.getElementById("status").innerText =
      "QC submitted successfully. Results will appear in the sheet.";
  })
  .catch(() => {
    document.getElementById("status").innerText = "Submission failed.";
  });
}
</script>

</body>
</html>
