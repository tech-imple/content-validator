<!DOCTYPE html>
<html>
<head>
  <title>Content Quality Check</title>
</head>
<body>

<h2>Content Validator</h2>

<input type="text" id="id" placeholder="Enter ID"><br><br>

<textarea id="content" placeholder="Enter Content" rows="6" cols="50"></textarea><br><br>

<input type="number" id="score" placeholder="Score"><br><br>

<button onclick="submitData()">Submit</button>

<p id="result"></p>

<script>
function submitData() {
  const data = {
    id: document.getElementById("id").value.trim(),
    content: document.getElementById("content").value.trim(),
    score: document.getElementById("score").value
  };

  fetch("https://script.google.com/macros/s/AKfycbwg7hhvgc_Iv2w4Fmz7UMW4nfc0JkbbaRDy93X6eFSqkYOWTDqHk8u9gX0f-pqwUso/exec", {
    method: "POST",
    mode: "no-cors",   // 🔥 IMPORTANT FOR GOOGLE SCRIPT
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(() => {
    document.getElementById("result").innerText = "Data submitted successfully";
  })
  .catch(err => {
    document.getElementById("result").innerText = "Submission failed";
    console.error(err);
  });
}
</script>

</body>
</html>
