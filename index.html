<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Content Quality Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 40px;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #555;
      margin-bottom: 20px;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input {
      width: 42%;
      padding: 10px;
      margin-right: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 10px 18px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      margin-top: 25px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border: 1px solid #e5e7eb;
      vertical-align: top;
    }

    th {
      background: #ecfdf5;
      text-align: left;
    }

    .pending {
      color: orange;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Content Quality Check</h1>
  <p>Layered GPT-based validation</p>

  <div class="box">
    <form id="qcForm">
      <input type="url" id="oldDoc" placeholder="Old Google Doc URL" required />
      <input type="url" id="newDoc" placeholder="New Google Doc URL" required />
      <button type="submit" id="runQC">Run QC</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Old Doc</th>
          <th>New Doc</th>
          <th>Layer-1 Output</th>
          <th>Layer-2 Output</th>
          <th>Final QC</th>
        </tr>
      </thead>
      <tbody id="qcTable"></tbody>
    </table>
  </div>

<script>
/* ================= CONFIG ================= */
const API_URL = "https://script.google.com/a/macros/testbook.com/s/AKfycbwg7hhvgc_Iv2w4Fmz7UMW4nfc0JkbbaRDy93X6eFSqkYOWTDqHk8u9gX0f-pqwUso/exec";

/* ================= SUBMIT HANDLER ================= */
document.getElementById("qcForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const oldDoc = document.getElementById("oldDoc").value.trim();
  const newDoc = document.getElementById("newDoc").value.trim();
  const button = document.getElementById("runQC");

  if (!oldDoc || !newDoc) {
    alert("Please enter both document URLs");
    return;
  }

  button.disabled = true;
  button.innerText = "Running...";

  const table = document.getElementById("qcTable");

  const row = document.createElement("tr");
  row.innerHTML = `
    <td><a href="${oldDoc}" target="_blank">Open</a></td>
    <td><a href="${newDoc}" target="_blank">Open</a></td>
    <td>Processing...</td>
    <td>Processing...</td>
    <td class="pending">Running</td>
  `;
  table.prepend(row);

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ oldDoc, newDoc })
    });

    if (!res.ok) throw new Error("Request failed");

    // QC runs async in sheet → UI just confirms submission
    row.children[4].innerHTML = "<strong>Submitted</strong>";

  } catch (err) {
    row.children[4].innerHTML = "<span class='error'>Error</span>";
    console.error(err);
  }

  button.disabled = false;
  button.innerText = "Run QC";
  document.getElementById("qcForm").reset();
});
</script>

</body>
</html>
